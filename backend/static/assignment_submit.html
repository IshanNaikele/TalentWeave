<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentFlow — Assignment Submission</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 40px 20px; }
  .brand { font-size: 0.85rem; color: #888; margin-bottom: 32px; letter-spacing: 0.05em; text-transform: uppercase; }
  h1 { font-size: 1.6rem; margin-bottom: 6px; }
  h2 { font-size: 1rem; color: #555; font-weight: normal; margin-bottom: 28px; }
  .job-badge { display: inline-block; background: #e8f4fd; border: 1px solid #aad4f0; color: #1a6a9a; font-size: 0.82rem; padding: 4px 10px; border-radius: 3px; margin-bottom: 24px; font-family: monospace; }
  label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 4px; margin-top: 16px; }
  input[type=text], input[type=email], input[type=tel], input[type=url] {
    width: 100%; padding: 10px 12px; border: 1px solid #ccc; background: #fff;
    font-size: 0.95rem; font-family: inherit; border-radius: 3px;
  }
  input:focus { outline: none; border-color: #333; }
  .btn {
    margin-top: 28px; padding: 11px 28px; background: #1a1a1a; color: #fff;
    border: none; cursor: pointer; font-size: 0.95rem; font-family: inherit;
    border-radius: 3px; width: 100%;
  }
  .btn:hover { background: #333; }
  .btn:disabled { background: #999; cursor: not-allowed; }
  .error { color: #c0392b; font-size: 0.85rem; margin-top: 12px; padding: 10px; background: #fdf0ee; border-radius: 3px; }
  .success { color: #27ae60; font-size: 0.95rem; margin-top: 20px; padding: 16px; background: #eafaf1; border: 1px solid #a9dfbf; border-radius: 4px; line-height: 1.6; }
  .note { font-size: 0.8rem; color: #888; margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">TalentFlow AI</div>
  <h1>Assignment Submission</h1>
  <h2>Submit your completed assignment below</h2>

  <div id="jobBadge" class="job-badge"></div>

  <div id="formSection">
    <label for="name">Full Name *</label>
    <input type="text" id="name" placeholder="Your full name">

    <label for="email">Email *</label>
    <input type="email" id="email" placeholder="your@email.com">

    <label for="phone">Phone *</label>
    <input type="tel" id="phone" placeholder="+91 9999999999">

    <label for="github">GitHub URL *</label>
    <input type="url" id="github" placeholder="https://github.com/yourusername">

    <label for="linkedin">LinkedIn URL *</label>
    <input type="url" id="linkedin" placeholder="https://linkedin.com/in/yourprofile">

    <label for="project">Project / Deployment URL</label>
    <input type="url" id="project" placeholder="https://your-deployed-app.com">
    <div class="note">Optional — paste your live deployment, Vercel, Netlify, etc.</div>

    <div id="submitError" class="error" style="display:none"></div>
    <button class="btn" id="submitBtn" onclick="submitAssignment()">Submit Assignment</button>
  </div>

  <div id="successMsg" class="success" style="display:none"></div>
</div>

<script>
  // Read job_id from URL — candidate never types this
  const params = new URLSearchParams(window.location.search);
  const jobId = params.get('job_id') || '';

  if (jobId) {
    document.getElementById('jobBadge').textContent = 'Job ID: ' + jobId;
  } else {
    document.getElementById('jobBadge').textContent = 'No Job ID in URL — invalid link';
    document.getElementById('jobBadge').style.background = '#fdf0ee';
    document.getElementById('jobBadge').style.color = '#c0392b';
    document.getElementById('jobBadge').style.borderColor = '#e8b4b0';
  }

  async function submitAssignment() {
    const name     = document.getElementById('name').value.trim();
    const email    = document.getElementById('email').value.trim();
    const phone    = document.getElementById('phone').value.trim();
    const github   = document.getElementById('github').value.trim();
    const linkedin = document.getElementById('linkedin').value.trim();
    const project  = document.getElementById('project').value.trim();
    const errEl    = document.getElementById('submitError');

    errEl.style.display = 'none';

    if (!jobId) {
      errEl.textContent = 'Invalid link — no job_id found in URL.';
      errEl.style.display = 'block'; return;
    }
    if (!name || !email || !phone || !github || !linkedin) {
      errEl.textContent = 'Please fill in all required fields.';
      errEl.style.display = 'block'; return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting…';

    try {
      const resp = await fetch('/api/assignment/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          job_id:      jobId,
          name,
          email,
          phone,
          github_id:   github,
          linkedin,
          action_link: project
        })
      });
      const data = await resp.json();

      if (!resp.ok) {
        errEl.textContent = data.detail || 'Submission failed. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Submit Assignment';
        return;
      }

      document.getElementById('formSection').style.display = 'none';
      const successEl = document.getElementById('successMsg');
      successEl.textContent = 'Your assignment has been submitted successfully. The recruiter will review after the submission window closes.';
      successEl.style.display = 'block';

    } catch (e) {
      errEl.textContent = 'Network error: ' + e.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Submit Assignment';
    }
  }
</script>
</body>
</html>
